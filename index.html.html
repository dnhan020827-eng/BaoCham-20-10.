<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12030f">
<title>Gửi Châm ngày 20/10 💖</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Playfair+Display:ital,wght@0,500;0,700;1,500;1,700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--rose:#ff5c93;--pink:#ff8fb8;--gold:#ffd9a0;--cream:#fff0f5;--line:rgba(255,255,255,.2)}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#12030f}
  body{font-family:'Quicksand',system-ui,sans-serif;color:var(--cream)}
  button{font-family:inherit}

  #bg{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at 50% 38%,#5c0f37 0%,#2b0621 48%,#0f020d 100%)}
  #cv{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
  #photos{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden}
  #flash{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 50%,#fff 0%,rgba(255,160,200,.8) 30%,rgba(255,92,147,0) 70%)}
  #flash.go{animation:flash 1.3s ease-out}
  @keyframes flash{0%{opacity:0}15%{opacity:.95}100%{opacity:0}}

  /* ---------- Ảnh ---------- */
  .ph{position:absolute;left:0;top:0;width:220px;height:220px;border-radius:22px;border:7px solid #fff;overflow:hidden;
    background:#4a1232;box-shadow:0 16px 36px rgba(0,0,0,.5),0 0 26px rgba(255,120,170,.3);pointer-events:auto;cursor:pointer;
    will-change:transform,opacity;visibility:hidden;backface-visibility:hidden}
  .ph::after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;pointer-events:none;z-index:2;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);
    animation:phshine 4.5s ease-in-out infinite;animation-delay:var(--sd,0s)}
  @keyframes phshine{0%,70%{left:-70%}100%{left:140%}}
  .ph img,.ph .tl{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none}
  .tl{display:grid;place-items:center;font-size:84px;background:linear-gradient(135deg,hsl(var(--h1) 85% 74%),hsl(var(--h2) 78% 56%))}

  /* ---------- Bảng lời chúc ---------- */
  #wishes{position:fixed;inset:0;z-index:4;display:grid;grid-template-rows:minmax(0,1fr);grid-template-columns:minmax(0,1fr);place-items:center;padding:16px 16px 96px;pointer-events:none;opacity:0;transition:opacity .8s}
  #wishes.on{opacity:1}
  #wishes.out{opacity:0;transition:opacity .6s}
  @property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
  .wbox{position:relative;width:min(660px,calc(100vw - 56px));transform-origin:center center;text-align:center;
    padding:28px 26px 24px;border-radius:30px;background:rgba(32,4,26,.5);border:1px solid var(--line);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 30px 80px rgba(0,0,0,.5)}
  .wbox::before{content:"";position:absolute;inset:-1px;border-radius:31px;padding:2px;pointer-events:none;
    background:conic-gradient(from var(--ang),transparent 0 55%,rgba(255,217,160,.95) 75%,rgba(255,143,184,.9) 85%,transparent 95%);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
    mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);animation:ang 6s linear infinite}
  @keyframes ang{to{--ang:360deg}}
  .rv{opacity:0;transform:translateY(24px);filter:blur(5px)}
  #wishes.on .rv{animation:rise .9s cubic-bezier(.2,.8,.2,1) var(--d,0s) forwards}
  @keyframes rise{to{opacity:1;transform:none;filter:none}}
  .kicker{font-size:.78rem;letter-spacing:.42em;text-transform:uppercase;color:var(--gold)}
  #wTitle{font-family:'Playfair Display',serif;font-style:italic;font-weight:500;font-size:clamp(1.5rem,4.6vw,2.5rem);line-height:1.15;margin:8px 0 4px;
    background:linear-gradient(120deg,#fff,#ffd1e3 45%,#ffd9a0);-webkit-background-clip:text;background-clip:text;color:transparent}
  #wTo{font-family:'Dancing Script',cursive;font-size:clamp(1.5rem,4vw,2.1rem);color:var(--pink)}
  #wSub{max-width:480px;margin:6px auto 0;font-size:.95rem;line-height:1.6;opacity:.85}
  .wg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
  .wi{padding:14px;border-radius:18px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14)}
  .wi .ic{font-size:1.8rem;display:block;margin-bottom:4px}
  .wi h3{font-family:'Playfair Display',serif;font-size:1.05rem;color:var(--gold);margin-bottom:4px}
  .wi p{font-size:.88rem;line-height:1.55;opacity:.92}
  @media(max-width:560px){
    .wg{grid-template-columns:1fr;gap:9px;margin-top:14px}
    .wi{display:flex;gap:12px;text-align:left;align-items:flex-start;padding:11px 13px}
    .wi .ic{font-size:1.6rem;margin:0}
    .wi p{font-size:.8rem;line-height:1.45}
    .wbox{padding:18px 14px 16px}
    .wi{padding:9px 11px}
    #wSub{font-size:.88rem}
  }
  @media(min-width:900px) and (max-height:720px){
    .wbox{width:min(1040px,calc(100vw - 150px));padding:20px 22px 18px}
    .wg{grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
    .wi p{font-size:.82rem;line-height:1.5}
  }

  #vig{position:fixed;inset:0;z-index:6;pointer-events:none;background:radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.5) 100%)}

  /* ---------- Chú thích trái tim & phần kết ---------- */
  #caption{position:fixed;left:0;right:0;bottom:calc(5vh + env(safe-area-inset-bottom));z-index:5;text-align:center;pointer-events:none;
    font-family:'Dancing Script',cursive;font-size:clamp(1.3rem,4vw,2rem);color:var(--gold);text-shadow:0 2px 14px rgba(0,0,0,.6);opacity:0;transition:opacity 1.2s}
  #caption.on{opacity:1}
  #finale{position:fixed;left:0;right:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:0 20px;opacity:0;pointer-events:none;transition:opacity 1.4s}
  #finale.on{opacity:1}
  #finale.on button{pointer-events:auto}
  .fbig{font-family:'Dancing Script',cursive;font-weight:700;font-size:clamp(2.6rem,min(14vw,11vh),5.4rem);line-height:1;
    background:linear-gradient(100deg,#ffd9a0,#fff 35%,#ff8fb8 65%,#ffd9a0);background-size:250% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite;filter:drop-shadow(0 4px 18px rgba(0,0,0,.5))}
  @keyframes shine{to{background-position:-250% 0}}
  #fText{max-width:560px;margin:8px auto 12px;font-size:clamp(.85rem,1.1vw + .45rem,1.1rem);line-height:1.6;text-shadow:0 2px 12px rgba(0,0,0,.7)}

  /* ---------- Nút ---------- */
  .btn{white-space:nowrap;position:relative;overflow:hidden;border:none;cursor:pointer;padding:15px 32px;border-radius:999px;font-weight:700;font-size:1.02rem;color:#fff;
    background:linear-gradient(135deg,#ff8fb8,#ff5c93 55%,#e0457b);box-shadow:0 10px 30px rgba(255,92,147,.55),inset 0 1px 0 rgba(255,255,255,.4);
    transition:transform .25s,box-shadow .25s}
  .btn:hover{transform:translateY(-3px) scale(1.03)}
  .btn:active{transform:scale(.97)}
  .btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);
    transform:skewX(-20deg);animation:shimmer 3s ease-in-out infinite}
  @keyframes shimmer{0%,60%{left:-60%}100%{left:140%}}
  #next{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));z-index:10;transform:translate(-50%,30px);opacity:0;pointer-events:none;
    transition:opacity .6s,transform .6s}
  #next.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  #next.show:hover{transform:translate(-50%,-3px) scale(1.03)}
  #skip{position:fixed;top:calc(14px + env(safe-area-inset-top));right:16px;z-index:10;padding:8px 16px;border-radius:999px;border:1px solid var(--line);
    background:rgba(255,255,255,.08);color:#fff;font-size:.85rem;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .5s;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  #skip.show{opacity:.85;pointer-events:auto}
  #music{position:fixed;right:16px;bottom:calc(24px + env(safe-area-inset-bottom));z-index:11;width:100px;height:100px;border-radius:50%;border:1px solid var(--line);
    background:rgba(255,255,255,.1);color:#fff;font-size:1.1rem;cursor:pointer;display:none;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}

  /* ---------- Màn hình mở đầu ---------- */
  #start{position:fixed;inset:0;z-index:50;display:grid;place-items:center;text-align:center;padding:24px;
    background:radial-gradient(ellipse at 50% 40%,#5c0f37 0%,#2b0621 50%,#0f020d 100%);transition:opacity 1s}
  #start.gone{opacity:0;pointer-events:none}
  .srose{font-size:4.4rem;animation:beat 1.5s ease-in-out infinite;filter:drop-shadow(0 0 26px rgba(255,92,147,.8))}
  @keyframes beat{0%,100%{transform:scale(1)}20%{transform:scale(1.16)}40%{transform:scale(1)}}
  #start h1{font-family:'Playfair Display',serif;font-style:italic;font-weight:500;font-size:clamp(1.7rem,6vw,2.8rem);margin:14px 0 6px;
    background:linear-gradient(120deg,#fff,#ffd1e3 45%,#ffd9a0);-webkit-background-clip:text;background-clip:text;color:transparent}
  #start p{opacity:.8;font-size:.95rem;margin-bottom:22px;letter-spacing:.04em}
  #go{display:none}
  #go.ready{display:inline-block}

  /* ---------- Lightbox ---------- */
  #lightbox{position:fixed;inset:0;background:rgba(20,4,15,.92);z-index:70;display:none;align-items:center;justify-content:center;padding:20px}
  #lightbox.open{display:flex;animation:fade .3s}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  #lightbox img{max-width:100%;max-height:82vh;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:zoomIn .35s}
  @keyframes zoomIn{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
  #lbCap{position:absolute;bottom:26px;left:0;right:0;text-align:center;color:#fff;font-family:'Dancing Script',cursive;font-size:1.8rem}
  .lb-btn{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:none;background:rgba(255,255,255,.2);color:#fff;font-size:1.5rem;cursor:pointer}
  .lb-btn:hover{background:rgba(255,107,157,.7)}
  #lbPrev{left:16px}#lbNext{right:16px}
  #lbClose{position:absolute;top:16px;right:20px;color:#fff;font-size:2rem;cursor:pointer;background:none;border:none}
</style>
</head>
<body>
<div id="bg"></div>
<canvas id="cv"></canvas>
<div id="photos"></div>
<div id="flash"></div>

<div id="wishes">
  <div class="wbox">
    <div class="kicker rv" id="wKick"></div>
    <h1 class="rv" id="wTitle"></h1>
    <div class="rv" id="wTo"></div>
    <p class="rv" id="wSub"></p>
    <div class="wg" id="wGrid"></div>
  </div>
</div>

<div id="vig"></div>
<div id="caption"></div>
<div id="finale">
  <div class="fbig" id="fBig"></div>
  <p id="fText"></p>
  <button class="btn" id="replay">Xem lại ↺</button>
</div>

<button class="btn" id="next"></button>
<button id="skip">Bỏ qua ›</button>
<button id="music" aria-label="Bật/tắt nhạc">🔊</button>
<audio id="audio" loop preload></audio>

<div id="start">
  <div>
    <div class="srose">🌹</div>
    <h1 id="sTitle"></h1>
    <p id="sLoad">Đang chuẩn bị quà...</p>
    <button class="btn" id="go"></button>
  </div>
</div>

<div id="lightbox">
  <button id="lbClose">✕</button>
  <button class="lb-btn" id="lbPrev">‹</button>
  <img alt="">
  <button class="lb-btn" id="lbNext">›</button>
  <div id="lbCap"></div>
</div>

<script>
/* ==========================================================
   ✏️ CẤU HÌNH — CHỈ CẦN SỬA PHẦN NÀY LÀ XONG
   ========================================================== */
const CONFIG = {
   tenCuaEm: "Bảo Châm",                      // tên hoặc biệt danh của bạn gái
  tenCuaAnh: "",                        // tên bạn
  loiMoDau: "Gửi cậu ngày 20/10",           // chữ ở màn hình chờ
  nutMoDau: "Chạm để mở quà 🎁",
  tieuDe: "Chúc mừng ngày Phụ nữ Việt Nam 20/10 ",
  loiDan: "n mong rằng c sẽ luôn ",
  nutXemAnh: "Một chút siêu dễ thươngg :>",
  chuTrongTim: "kho báu của n nè :D ",

  /* ---------- CÁCH 1: KHAI BÁO TỪNG ẢNH ----------
     Mỗi dòng là 1 ảnh: src = tên file (để cùng thư mục với file HTML) hoặc link ảnh,
     chuThich = chữ hiện khi xem ảnh to. Muốn dùng thì xóa dấu // ở đầu dòng.
     Thêm ảnh = thêm 1 dòng, nhớ dấu phẩy cuối dòng. */
  anh: [
     { src: "anh1.jpg.jpg", },
     { src: "anh2.jpg.jpg", },
     { src: "anh3.jpg.jpg", },
     { src: "anh4.jpg.jpg",  },
     { src: "anh5.jpg.jpg",  },
     { src: "anh6.jpg.jpg",  },
     { src: "anh7.jpg.jpg", },
     { src: "anh8.jpg.jpg",  },
     { src: "anh9.jpg.jpg",  },
     { src: "anh10.jpg.jpg",  },
     { src: "anh11.jpg.jpg",  },
     { src: "anh12.jpg.jpg",  },
     { src: "anh13.jpg.jpg",  },
     { src: "anh14.jpg.jpg",  },
     { src: "anh15.jpg.jpg",  },
     { src: "anh16.jpg.jpg",  },
     { src: "anh17.jpg.jpg", },
     { src: "anh18.jpg.jpg",  },
     { src: "anh19.jpg.jpg",  },
     { src: "anh20.jpg.jpg",  },
     { src: "anh21.jpg.jpg",  },
  ],

  /* ---------- CÁCH 2: TỰ NẠP ẢNH THEO SỐ THỨ TỰ (nhanh nhất) ----------
     Đặt tên ảnh là anh1.jpg, anh2.jpg, ... cùng thư mục với file HTML, trang tự nạp.
     File nào không tồn tại thì tự bỏ qua. thuMuc: nếu ảnh nằm trong thư mục con, ví dụ "anh/" */
  tuNapAnh: { bat: true, thuMuc: "", tienTo: "anh", duoi: "jpg", soLuong: 30, chuThich: [] },

  hieuUng: {
    soHoa: 260,            // số bông hồng bay ở phần mở đầu (máy yếu thì giảm xuống 150)
    soAnhTrenManHinh: 40,  // tổng số ảnh bay / tạo hình trái tim (ít ảnh thì tự lặp lại)
    soHang: 4,             // số hàng ảnh chạy sóng ở phần cuối (nên là số chẵn)
    tocDoAnh: 70,          // tốc độ ảnh chạy ngang (px/giây)
    lapLanh: false         // true = bật các ngôi sao lấp lánh, false = tắt
  },

 loiChuc: [
    { icon: "🌸", tieuDe: "Luôn xinh đẹp",  noiDung: "Chúc Châm  mỗi ngày đều rạng rỡ như một đóa hoa." },
    { icon: "💪", tieuDe: "Luôn mạnh mẽ",   noiDung: "Chúc Châm luôn đủ sức khỏe và bản lĩnh để chinh phục mọi mục tiêu nhóoo." },
    { icon: "😊", tieuDe: "Luôn hạnh phúc", noiDung: "Chúc Châm thật nhiều niềm vui, ít muộn phiền ạaa ." },
    { icon: "💖", tieuDe: "Luôn được yêu",  noiDung: "Chúc Châm  luôn được yêu thương, được trân trọng và mong rằng mọi điều ngọt ngào nhất trên đời này đều sẽ tìm đến với cậu :D." }
  ],

  ketTieuDe: "Iuuu c nhìu ạaa:>",
  ketNoiDung: "Chúc c ngày 20/10 thật trọn vẹn và hạnh phúc ạaaa.",
  nutXemLai: "Xem lại ↺",

  /* ---------- NHẠC NỀN ----------
     Đặt file nhạc cùng thư mục với file HTML và đặt tên là 10d (ví dụ 10d.mp3).
     Chỉ cần điền tên không có đuôi, trang tự dò đuôi .mp3 / .m4a / .ogg / .wav.
     Muốn dùng tên khác thì sửa "10d" thành tên bạn muốn, hoặc ghi cả đuôi, ví dụ "nhac.mp3".
     Để "" nếu không dùng nhạc. Nhạc tự phát khi bấm "Chạm để mở quà", có nút 🎵 bật/tắt ở góc phải. */
  nhac: "10d",
  duoiNhac: ["mp3", "m4a", "ogg", "wav"],
  amLuong: 0.85,                           // âm lượng nhạc nền từ 0 đến 1

  /* ---------- ÂM THANH HIỆU ỨNG (chèn thêm âm thanh bên ngoài) ----------
     Mỗi dòng là một khoảnh khắc trong màn trình diễn. Điền tên file âm thanh (để cùng thư mục
     với file HTML, ví dụ "tieng-gio.mp3") hoặc link âm thanh trên mạng. Để "" nếu không dùng.
     Có thể chèn bao nhiêu dòng tùy thích, dòng nào để "" thì bỏ qua. */
  amThanh: {
    hoaBay:   "hihi.mp3.mp3",   // lúc bão hoa hồng bắt đầu bay
    tuLai:    "",   // lúc hoa xoáy tụ vào giữa màn hình
    hoaNo:    "",   // lúc bông hồng khổng lồ nở ra và tỏa tia sáng
    loiChuc:  "",   // lúc bảng lời chúc hiện ra
    anhBay:   "",   // lúc ảnh bắt đầu bay tứ tung
    traiTim:  "",   // lúc ảnh xếp thành trái tim
    chaySong: "",   // lúc ảnh dạt ra chạy sóng
    ketThuc:  "",   // lúc hiện chữ kết "Yêu em"
    bamNut:   ""    // mỗi lần bấm nút
  },
  amLuongHieuUng: 0.4                      // âm lượng các âm thanh hiệu ứng từ 0 đến 1
};

/* ==========================================================
   PHẦN DƯỚI LÀ CODE HOẠT ĐỘNG, KHÔNG CẦN SỬA NẾU KHÔNG CẦN
   ========================================================== */
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeInCubic = t => t * t * t;
const easeInOutCubic = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ---------- Gom danh sách ảnh rồi lọc ảnh thật sự tồn tại ---------- */
function buildPhotoList() {
  const list = [...(CONFIG.anh || [])];
  const seen = new Set(list.map(p => p.src));
  const t = CONFIG.tuNapAnh;
  if (t && t.bat) {
    for (let i = 1; i <= t.soLuong; i++) {
      const src = (t.thuMuc || '') + t.tienTo + i + '.' + t.duoi;
      if (seen.has(src)) continue;
      list.push({ src, chuThich: (t.chuThich && t.chuThich[i - 1]) || 'Kỷ niệm 💕' });
    }
  }
  return list;
}
function validatePhotos(list) {
  return Promise.all(list.map(p => new Promise(res => {
    const im = new Image();
    const t = setTimeout(() => res(null), 6000);
    im.onload = () => { clearTimeout(t); res(p); };
    im.onerror = () => { clearTimeout(t); res(null); };
    im.src = p.src;
  }))).then(a => a.filter(Boolean));
}

/* ---------- Vẽ bông hồng bằng code (không cần file ảnh) ---------- */
const PALS = [
  ['#7a0a1e', '#c8102e', '#ff5a6e'],
  ['#8e0f2f', '#e0214f', '#ff7d9a'],

    const r = Math.min(W, H) * .8, x = W / 2 * dpr, y = H / 2 * dpr;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r * dpr);
    g.addColorStop(0, 'rgba(255,80,140,' + a + ')'); g.addColorStop(1, 'rgba(255,80,140,0)');
    ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = g; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.globalCompositeOperation = 'source-over';
  }
  function drawGiant(st) {
    let s, a;
    if (stage === 'gather') {
      const gt = st - 1.7; if (gt < 0) return;
      if (!giant.sfx) { giant.sfx = true; playSfx('hoaNo'); burstSpark(W / 2, H / 2, 70); }
      s = easeOutBack(clamp(gt / 1.3)); a = 1;
    } else if (stage === 'garland' && giant.on) {
      if (st > 1.1) { giant.on = false; return; }
      s = 1 + easeInCubic(st / 1.1) * 3.2; a = 1 - st / 1.1;
    } else return;
    drawRays(st, clamp(a) * clamp(s));
    const size = Math.min(W, H) * .62 * s;
    const rot = (stage === 'garland' ? st + 4 : st) * .25, c = Math.cos(rot), sn = Math.sin(rot);
    ctx.globalAlpha = clamp(a);
    ctx.setTransform(c * dpr, sn * dpr, -sn * dpr, c * dpr, W / 2 * dpr, H / 2 * dpr);
    ctx.drawImage(giantSprite, -size / 2, -size / 2, size, size);
    ctx.globalAlpha = 1; ctx.setTransform(1, 0, 0, 1, 0, 0);
  }

  /* ================= ẢNH ================= */
  const EMO = ['🌸', '💗', '🌷', '💖', '✨', '🎀', '🌹', '💕'];
  function tile(i) {
    const d = document.createElement('div');
    d.className = 'tl';
    const h = 330 + (i * 17) % 40;
    d.style.setProperty('--h1', h); d.style.setProperty('--h2', h + 18);
    d.textContent = EMO[i % EMO.length];
    return d;
  }
  function imgEl(p, i) {
    const im = document.createElement('img');
    im.alt = ''; im.draggable = false; im.src = p.src;
    im.onerror = () => im.replaceWith(tile(i));
    return im;
  }

  const lb = $('lightbox'); let lbIndex = 0;
  function showLb(i) {
    lbIndex = (i + photos.length) % photos.length;
    const img = lb.querySelector('img');
    img.src = photos[lbIndex].src;
    $('lbCap').textContent = photos[lbIndex].chuThich || '';
    img.style.animation = 'none'; void img.offsetWidth; img.style.animation = '';
  }
  function openLb(i) { if (!photos.length) return; showLb(i); lb.classList.add('open'); }
  $('lbPrev').onclick = e => { e.stopPropagation(); showLb(lbIndex - 1); };
  $('lbNext').onclick = e => { e.stopPropagation(); showLb(lbIndex + 1); };
  $('lbClose').onclick = () => lb.classList.remove('open');
  lb.onclick = e => { if (e.target === lb) lb.classList.remove('open'); };
  document.addEventListener('keydown', e => {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') lb.classList.remove('open');
    if (e.key === 'ArrowLeft') showLb(lbIndex - 1);
    if (e.key === 'ArrowRight') showLb(lbIndex + 1);
  });

  const PS = { phase: 'off', t0: 0, items: [], cap: false, fin: false };
  const L = {};
  const T_HEART = 5.2, T_WAVE = 12.4;
  const photoCount = () => Math.min(80, Math.max(FX.soAnhTrenManHinh || 40, photos.length));
  const beatAt = tt => {
    const p = tt % 1;
    return 1 + .05 * Math.exp(-Math.pow((p - .1) / .07, 2)) + .035 * Math.exp(-Math.pow((p - .38) / .08, 2));
  };

  /* Xếp N ảnh thành hình trái tim (nhiều lớp lồng nhau) */
  function heartLayout(N) {
    const M = 720, pts = [];
    let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
    for (let k = 0; k <= M; k++) {
      const t = k / M * Math.PI * 2;
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      pts.push([x, y]);
      minX = Math.min(minX, x); maxX = Math.max(maxX, x); minY = Math.min(minY, y); maxY = Math.max(maxY, y);
    }
    const cxh = (minX + maxX) / 2, cyh = (minY + maxY) / 2;
    const s = Math.min(W * .74 / (maxX - minX), H * .6 / (maxY - minY));
    const cum = [0];
    for (let k = 1; k <= M; k++) cum[k] = cum[k - 1] + Math.hypot(pts[k][0] - pts[k - 1][0], pts[k][1] - pts[k - 1][1]) * s;
    const P = cum[M];
    const scales = [1, .7, .42, .16], sumS = scales.reduce((a, b) => a + b, 0);
    const d = P * sumS / N;
    const counts = scales.map(sc => Math.max(1, Math.round(P * sc / d)));
    counts[0] += N - counts.reduce((a, b) => a + b, 0);
    if (counts[0] < 1) counts[0] = 1;
    const ox = W / 2, oy = H * .45, out = [];
    scales.forEach((sc, li) => {
      const n = counts[li];
      for (let j = 0; j < n; j++) {
        const target = (j + (li % 2 ? .5 : 0)) / n * P;
        let lo = 0, hi = M;
        while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (cum[mid] <= target) lo = mid; else hi = mid; }
        const f = (target - cum[lo]) / ((cum[hi] - cum[lo]) || 1);
        const px = lerp(pts[lo][0], pts[hi][0], f), py = lerp(pts[lo][1], pts[hi][1], f);
        out.push({ x: ox + (px - cxh) * s * sc, y: oy + (py - cyh) * s * sc });
      }
    });
    while (out.length < N) out.push({ x: ox, y: oy });
    return { pts: out, d, ox, oy, s, c: [cxh, cyh] };
  }

  function computeLayout() {
    const N = PS.items.length;
    const hl = heartLayout(N);
    L.heart = hl.pts; L.ox = hl.ox; L.oy = hl.oy; L.hS = hl.s; L.hC = hl.c;
    L.hs = clamp(hl.d * 1.02, 30, Math.min(W, H) * .22);
    const R = Math.max(2, FX.soHang || 4), topN = Math.ceil(R / 2);
    let gapH = clamp(H * .32, 150, 300);
    gapH = Math.max(40, Math.min(gapH, H - R * 56));
    const rowH = (H - gapH) / R;
    L.rows = R; L.rowsY = [];
    for (let r = 0; r < R; r++) L.rowsY.push(r < topN ? rowH * (r + .5) : H - rowH * (R - r - .5));
    L.rsize = rowH * .84; L.margin = L.rsize * 1.25;
    const perRow = Math.ceil(N / R);
    L.spacing = Math.max(L.rsize * 1.2, (W + 2 * L.margin) / perRow);
    L.rowLen = L.spacing * perRow;
    L.A = rowH * .2; L.k = 2 * Math.PI / Math.max(380, W * .5);
    const fin = $('finale');
    fin.style.top = (rowH * topN) + 'px'; fin.style.height = gapH + 'px';
  }

  function startPhotos(now) {
    const N = photoCount(), layer = $('photos');
    if (!PS.items.length) {
      const order = shuffle(photos.map((_, i) => i));
      PS.items = Array.from({ length: N }, (_, i) => {
        const pi = photos.length ? order[i % order.length] : -1;
        const el = document.createElement('div');
        el.className = 'ph';
        el.appendChild(pi >= 0 ? imgEl(photos[pi], i) : tile(i));
        el.onclick = () => { if (pi >= 0) openLb(pi); };
        layer.appendChild(el);
        return { el, pi, i, z: '' };
      });
    }
    computeLayout();
    PS.items.forEach(it => {
      Object.assign(it, {
        ax: rnd(.2, .42), bx: rnd(0, .08), ay: rnd(.2, .42), by: rnd(0, .08),
        wx: rnd(.5, 1.3), wy: rnd(.5, 1.3), px: rnd(0, 6.28), py: rnd(0, 6.28),
        wr: rnd(.6, 1.4), pr: rnd(0, 6.28), r0: rnd(-25, 25), hr: rnd(-8, 8),
        ed: it.i * .045 + rnd(0, .3), hd: rnd(0, .7), wd: it.i * .02 + rnd(0, .6),
        row: it.i % L.rows, j: Math.floor(it.i / L.rows),
        cs: clamp(Math.min(W, H) * rnd(.16, .3), 70, 240)
      });
      const side = (Math.random() * 4) | 0;
      it.ex = side === 0 ? -.3 * W : side === 1 ? 1.3 * W : rnd(-.1 * W, 1.1 * W);
      it.ey = side === 2 ? -.3 * H : side === 3 ? 1.3 * H : rnd(0, H);
      it.el.style.setProperty('--sd', (-rnd(0, 4.5)).toFixed(2) + 's');
    });
    PS.phase = 'on'; PS.t0 = now; PS.cap = false; PS.fin = false; PS.sh = false; PS.sw = false;
    playSfx('anhBay');
  }
  function stopPhotos() {
    PS.phase = 'off';
    PS.items.forEach(it => { it.el.style.visibility = 'hidden'; });
    $('caption').classList.remove('on'); $('finale').classList.remove('on');
  }

  function waveAt(it, tw) {
    const dir = it.row % 2 === 0 ? 1 : -1, sp = FX.tocDoAnh || 70;
    const x = (((it.j * L.spacing + dir * sp * tw) % L.rowLen) + L.rowLen) % L.rowLen - L.margin;
    const ph = L.k * x + 1.5 * tw + it.row * .9;
    const sc = .86 + .32 * (.5 + .5 * Math.sin(ph + 1.2));
    return {
      x, y: L.rowsY[it.row] + L.A * Math.sin(ph), sc,
      size: L.rsize * sc, rot: Math.atan(L.A * L.k * Math.cos(ph)) * 57.3 * .7
    };
  }

  function updatePhotos(now) {
    if (PS.phase !== 'on') return;
    const tc = (now - PS.t0) / 1000;
    const bt = tc > T_HEART + 1.6 ? beatAt(tc - T_HEART - 1.6) : 1;
    if (!PS.cap && tc > 7.0 && tc < T_WAVE) { PS.cap = true; $('caption').classList.add('on'); }
    if (PS.cap && tc >= T_WAVE) { PS.cap = false; $('caption').classList.remove('on'); }
    if (!PS.sh && tc > T_HEART + .6) { PS.sh = true; playSfx('traiTim'); }
    if (!PS.sw && tc >= T_WAVE) { PS.sw = true; playSfx('chaySong'); }
    if (!PS.fin && tc > T_WAVE + 2.6) { PS.fin = true; $('finale').classList.add('on'); playSfx('ketThuc'); }
    const tw = Math.max(0, tc - T_WAVE);
    for (const it of PS.items) {
      const ce = easeOutCubic(clamp((tc - it.ed) / 1.5));
      const cx_ = W / 2 + it.ax * W * Math.sin(it.wx * tc + it.px) + it.bx * W * Math.sin(it.wx * 2.3 * tc + it.px * 2);
      const cy_ = H / 2 + it.ay * H * Math.cos(it.wy * tc + it.py) + it.by * H * Math.sin(it.wy * 1.9 * tc);
      let x = lerp(it.ex, cx_, ce), y = lerp(it.ey, cy_, ce);
      let size = it.cs * (.92 + .1 * Math.sin(tc * it.wr + it.px));
      let rot = it.r0 + 34 * Math.sin(tc * it.wr * .8 + it.pr);
      const alpha = clamp(ce * 3);
      let z = Math.round(size);
      const he = easeInOutCubic(clamp((tc - T_HEART - it.hd) / 1.5));
      const hp = L.heart[it.i] || { x: W / 2, y: H / 2 };
      if (he > 0) {
        const hx = L.ox + (hp.x - L.ox) * bt, hy = L.oy + (hp.y - L.oy) * bt;
        x = lerp(x, hx, he); y = lerp(y, hy, he);
        size = lerp(size, L.hs * (1 + (bt - 1) * .6), he); rot = lerp(rot, it.hr, he);
        z = it.i;
      }
      const we = easeInOutCubic(clamp((tc - T_WAVE - it.wd) / 1.9));
      if (we > 0) {
        const w = waveAt(it, tw);
        const dx = hp.x - L.ox, dy = hp.y - L.oy, dl = Math.hypot(dx, dy) || 1;
        const push = Math.sin(Math.PI * we) * 70;
        x = lerp(x, w.x, we) + dx / dl * push; y = lerp(y, w.y, we) + dy / dl * push;
        size = lerp(size, w.size, we); rot = lerp(rot, w.rot, we);
        if (we > .5) z = Math.round(w.sc * 100);
      }
      const s = size / 220;
      const st = it.el.style;
      st.transform = 'translate3d(' + (x - 110).toFixed(1) + 'px,' + (y - 110).toFixed(1) + 'px,0) rotate(' + rot.toFixed(2) + 'deg) scale(' + s.toFixed(3) + ')';
      st.opacity = alpha.toFixed(2);
      st.visibility = 'visible';
      if (it.z !== z) { it.z = z; st.zIndex = z; }
    }
  }

  /* ================= GIAO DIỆN ================= */
  $('wKick').textContent = '20 · 10'; $('wKick').style.setProperty('--d', '.2s');
  $('wTitle').textContent = CONFIG.tieuDe; $('wTitle').style.setProperty('--d', '.45s');
  $('wTo').textContent = 'Gửi tới ' + CONFIG.tenCuaEm + ' 💗'; $('wTo').style.setProperty('--d', '.75s');
  $('wSub').textContent = CONFIG.loiDan; $('wSub').style.setProperty('--d', '1s');
  CONFIG.loiChuc.forEach((w, i) => {
    const d = document.createElement('div');
    d.className = 'wi rv';
    d.style.setProperty('--d', (1.4 + i * .7) + 's');
    d.innerHTML = '<span class="ic"></span><div><h3></h3><p></p></div>';
    d.querySelector('.ic').textContent = w.icon;
    d.querySelector('h3').textContent = w.tieuDe;
    d.querySelector('p').textContent = w.noiDung;
    $('wGrid').appendChild(d);
  });
  $('next').textContent = CONFIG.nutXemAnh;
  $('caption').textContent = CONFIG.chuTrongTim;
  $('fBig').textContent = CONFIG.ketTieuDe;
  $('fText').textContent = CONFIG.ketNoiDung;
  $('replay').textContent = CONFIG.nutXemLai;

  function fitWishes() {
    const box = document.querySelector('.wbox');
    box.style.transform = 'none';
    const nw = box.offsetWidth, nh = box.offsetHeight;
    const k = clamp(Math.min(1, (H - 96 - 28) / nh, (W - 24) / nw), .45, 1);
    box.style.transform = k < 1 ? 'scale(' + k.toFixed(3) + ')' : 'none';
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if ($('wishes').classList.contains('on')) fitWishes(); });
  function openWishes() {
    uiStage = 'wishes'; fitWishes(); playSfx('loiChuc');
    $('wishes').classList.add('on');
    const last = 1.4 + Math.max(0, CONFIG.loiChuc.length - 1) * .7;
    clearTimeout(TM.next);
    TM.next = setTimeout(() => $('next').classList.add('show'), (last + 1.1) * 1000);
  }
  $('next').onclick = () => {
    if (uiStage !== 'wishes') return;
    playSfx('bamNut');
    uiStage = 'photos';
    $('next').classList.remove('show');
    $('wishes').classList.add('out');
    enterBurst(performance.now());
    clearTimeout(TM.ph);
    TM.ph = setTimeout(() => startPhotos(performance.now()), 700);
  };
  $('skip').onclick = () => {
    playSfx('bamNut');
    if (stage === 'storm' || stage === 'gather') enterGarland(performance.now());
  };
  $('replay').onclick = () => {
    playSfx('bamNut');
    clearTimeout(TM.wish); clearTimeout(TM.next); clearTimeout(TM.ph);
    stopPhotos();
    $('wishes').classList.remove('on', 'out');
    $('next').classList.remove('show');
    uiStage = 'intro'; $('skip').classList.add('show');
    enterStorm(performance.now());
  };

  /* ---------- Nhạc nền ---------- */
  const audio = $('audio'), musicBtn = $('music');
  let musicReady = false, musicWanted = false, fadeT = null;
  function probeMusic() {
    const name = CONFIG.nhac;
    if (!name) return Promise.resolve('');
    const list = (/^https?:/i.test(name) || /\.[a-z0-9]{2,4}(\?.*)?$/i.test(name)) ? [name] : (CONFIG.duoiNhac || ['mp3']).map(e => name + '.' + e);
    return list.reduce((pr, src) => pr.then(found => found || new Promise(res => {
      const a = new Audio();
      const t = setTimeout(() => res(''), 5000);
      a.onloadedmetadata = () => { clearTimeout(t); res(src); };
      a.onerror = () => { clearTimeout(t); res(''); };
      a.preload = 'metadata'; a.src = src;
    })), Promise.resolve(''));
  }
  function playMusic() {
    const vol = clamp(CONFIG.amLuong == null ? .85 : CONFIG.amLuong);
    audio.volume = 0;
    const p = audio.play();
    if (p && p.catch) p.catch(() => {});
    clearInterval(fadeT);
    let v = 0;
    fadeT = setInterval(() => { v += vol / 30; audio.volume = Math.min(vol, v); if (v >= vol) clearInterval(fadeT); }, 70);
    musicBtn.textContent = '🎵';
  }
  probeMusic().then(src => {
    if (!src) return;
    audio.src = src; musicReady = true;
    musicBtn.style.display = 'block';
    if (musicWanted) playMusic();
  });
  musicBtn.onclick = () => {
    if (!musicReady) return;
    if (audio.paused) playMusic();
    else { audio.pause(); musicBtn.textContent = '🔇'; }
  };
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && !audio.paused) { audio.pause(); audio.dataset.auto = '1'; }
    else if (!document.hidden && audio.dataset.auto === '1') { audio.dataset.auto = ''; audio.play().catch(() => {}); }
  });

  /* ---------- Vòng lặp vẽ ---------- */
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    const st = (now - stageStart) / 1000;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, cv.width, cv.height);
    const sst = (now - stageStart) / 1000;
    drawGlow(st);
    stepRoses(dt, sst, now);
    drawRoses();
    stepPetals(dt); drawPetals(stage === 'idle' ? 0 : stage === 'ambient' ? .6 : .9);
    drawHeartGlow(now);
    drawGiant(sst);
    stepSparks(dt); ambientSparks(dt); drawSparks();
    updatePhotos(now);
    requestAnimationFrame(frame);
  }
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    buildGT(); initPetals();
    if (PS.items.length) computeLayout();
    if ($('wishes').classList.contains('on')) fitWishes();
  }
  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);

  /* ---------- Màn hình chờ -> bắt đầu ---------- */
  $('sTitle').textContent = CONFIG.loiMoDau;
  $('go').textContent = CONFIG.nutMoDau;
  $('sLoad').style.display = 'none';
  $('go').classList.add('ready');
  $('go').onclick = () => {
    $('start').classList.add('gone');
    musicWanted = true;
    if (musicReady) playMusic();
    uiStage = 'intro'; $('skip').classList.add('show');
    enterStorm(performance.now());
    unlockSfx(['hoaBay', 'bamNut']); playSfx('bamNut'); playSfx('hoaBay');
  };
}
</script>
